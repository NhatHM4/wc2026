version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bet-postgres
    environment:
      - POSTGRES_DB=betdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    image: dinhdatqn123/wc2026:latest
    container_name: bet-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/betdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - VIETQR_CLIENT_ID=${VIETQR_CLIENT_ID}
      - VIETQR_API_KEY=${VIETQR_API_KEY}
      - VIETQR_ACCOUNT_NO=${VIETQR_ACCOUNT_NO}
      - VIETQR_ACCOUNT_NAME=${VIETQR_ACCOUNT_NAME}
      - VIETQR_ACQ_ID=${VIETQR_ACQ_ID}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
    depends_on:
      - postgres
    restart: always

  frontend:
    image: dinhdatqn123/wc2026-fe:latest
    container_name: bet-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
