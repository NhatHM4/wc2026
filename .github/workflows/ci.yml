name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (Java 17 & Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend
        run: |
          cd backend
          mvn clean test

  frontend-ci:
    name: Frontend CI (Node.js & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Compile Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  deploy:
    name: Build, Push & Deploy to Server
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            dinhdatqn123/wc2026:latest
            dinhdatqn123/wc2026:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/
          tags: |
            dinhdatqn123/wc2026-fe:latest
            dinhdatqn123/wc2026-fe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose.prod.yml to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "~"
          overwrite: true

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        env:
          VIETQR_CLIENT_ID: ${{ secrets.VIETQR_CLIENT_ID }}
          VIETQR_API_KEY: ${{ secrets.VIETQR_API_KEY }}
          VIETQR_ACCOUNT_NO: ${{ secrets.VIETQR_ACCOUNT_NO }}
          VIETQR_ACCOUNT_NAME: ${{ secrets.VIETQR_ACCOUNT_NAME }}
          VIETQR_ACQ_ID: ${{ secrets.VIETQR_ACQ_ID }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VIETQR_CLIENT_ID,VIETQR_API_KEY,VIETQR_ACCOUNT_NO,VIETQR_ACCOUNT_NAME,VIETQR_ACQ_ID,GMAIL_USERNAME,GMAIL_PASSWORD
          script: |
            # Rename prod compose to standard docker-compose name
            mv ~/docker-compose.prod.yml ~/docker-compose.yml || true
            
            # Write environment variables to .env file for docker compose
            echo "VIETQR_CLIENT_ID=$VIETQR_CLIENT_ID" > ~/env_temp
            echo "VIETQR_API_KEY=$VIETQR_API_KEY" >> ~/env_temp
            echo "VIETQR_ACCOUNT_NO=$VIETQR_ACCOUNT_NO" >> ~/env_temp
            echo "VIETQR_ACCOUNT_NAME=$VIETQR_ACCOUNT_NAME" >> ~/env_temp
            echo "VIETQR_ACQ_ID=$VIETQR_ACQ_ID" >> ~/env_temp
            echo "GMAIL_USERNAME=$GMAIL_USERNAME" >> ~/env_temp
            echo "GMAIL_PASSWORD=$GMAIL_PASSWORD" >> ~/env_temp
            mv ~/env_temp ~/.env
            
            # Pull latest images from Docker Hub
            docker compose pull
            
            # Recreate containers
            docker compose down --remove-orphans || true
            docker compose up -d
            
            # Clean up old unused images
            docker image prune -f
